name: RAG Eval Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/golden/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run offline eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MILVUS_HOST: localhost
          MILVUS_PORT: 19530
        run: |
          python -m src.eval.runner \
            --golden-set tests/golden/enterprise_qa.jsonl \
            --baseline tests/golden/baseline_metrics.json \
            --output /tmp/eval_report.md

      - name: Post eval results as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/eval_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Check for regressions
        run: |
          if grep -q "CI gate failed" /tmp/eval_report.md; then
            echo "Eval gate failed — metric regressions detected"
            exit 1
          fi
